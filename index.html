<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --card: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.12);
            --text: #e8ebf3;
            --muted: #9aa3b2;
            --accent: #6cf2c2;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            color: var(--text);
            background:
                    radial-gradient(1200px 600px at 10% -10%, #1a2340, transparent 40%),
                    radial-gradient(800px 500px at 90% 10%, #12302a, transparent 45%),
                    var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            width: 100%;
            max-width: 520px;
            padding: 24px;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0 0 24px 0;
            color: var(--muted);
            font-size: 14px;
        }

        .contacts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        /* Специальная кнопка Telegram */
        .btn.tg {
            flex-direction: column;
            align-items: stretch;
            padding: 18px;
            gap: 14px;
        }

        .btn.tg .icon {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
        }

        .btn.tg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        .btn.tg .content {
            align-items: center;
            text-align: center;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            color: var(--text);
            text-decoration: none;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(108,242,194,0.15);
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 18px;
            background: rgba(255,255,255,0.12);
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 15px;
            font-weight: 600;
        }

        .hint {
            font-size: 13px;
            color: var(--muted);
        }

        footer {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
